name: autoupdate

on:
  schedule:
    - cron: '0 20 14,28 * *'
  workflow_dispatch:

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.COATL_BOT_GH_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Upgrade uvx requirements
        run: |
          python -m pip install --dry-run --no-deps --report "$RUNNER_TEMP/uvx.json" --requirement uvx.in
          jq -r '.install[].metadata | "\(.name)==\(.version)"' "$RUNNER_TEMP/uvx.json" > uvx.txt
        working-directory: requirements

      - name: Detect changes
        id: git-diff
        uses: coatl-dev/actions/simple-git-diff@c339f0299e21b3b28b42414e3ea474d33468713c # v7.1.5

      - name: Import GPG key
        if: ${{ steps.git-diff.outputs.diff == 'true' }}
        id: gpg-import
        uses: coatl-dev/actions/gpg-import@c339f0299e21b3b28b42414e3ea474d33468713c # v7.1.5
        with:
          passphrase: ${{ secrets.COATL_BOT_GPG_PASSPHRASE }}
          private-key: ${{ secrets.COATL_BOT_GPG_PRIVATE_KEY }}

      - name: Commit and push changes
        if: ${{ steps.git-diff.outputs.diff == 'true' }}
        run: |
          git checkout -B autoupdate
          git add -u
          git commit -m "build(deps): update build dependencies"
          git push --force --set-upstream origin autoupdate

      - name: Create pull request
        if: ${{ steps.git-diff.outputs.diff == 'true' }}
        uses: coatl-dev/actions/pr-create@c339f0299e21b3b28b42414e3ea474d33468713c # v7.1.5
        with:
          gh-token: ${{ secrets.COATL_BOT_GH_TOKEN }}
